apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fetcher
  template:
    metadata:
      labels:
        app: fetcher
    spec:
      containers:
        - name: fetcher
          image: pipeline-fetcher:latest
          # Built locally and side-loaded (kind load / minikube image load), not pulled.
          # Without this, the :latest tag defaults to Always and the pod sits in ImagePullBackOff.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: weather-config
          # To use mock data, uncomment:
          # env:
          #   - name: USE_MOCK
          #     value: "true"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: fetcher-service
spec:
  selector:
    app: fetcher
  ports:
    - port: 3000
      targetPort: 3000
